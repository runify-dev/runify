name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build backend with Maven
        run: mvn clean package -DskipTests

      - name: Rename jar
        run: mv backend/target/backend.jar backend/target/runify.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/runify.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          files: backend/target/runify.jar
          generate_release_notes: true

  build-desktop:
    needs: build-jar
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: installer/electron

      - name: Download JRE
        shell: bash
        run: |
          cd installer
          bash installer.sh --jre-only 2>/dev/null || true
          # Download JDK 25 for the platform
          JAVA_VERSION="25"
          HASH="bd75d5f9689641da8e1daabeccb5528b"
          BASE="https://download.java.net/java/GA/jdk${JAVA_VERSION}/${HASH}/36/GPL"
          JRE_DIR="electron/jre"
          mkdir -p "$JRE_DIR"

          if [ "${{ matrix.platform }}" = "mac" ]; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then
              URL="${BASE}/openjdk-${JAVA_VERSION}_macos-aarch64_bin.tar.gz"
            else
              URL="${BASE}/openjdk-${JAVA_VERSION}_macos-x64_bin.tar.gz"
            fi
            curl -L --connect-timeout 10 --max-time 600 -o /tmp/jdk.tar.gz "$URL"
            tar -xzf /tmp/jdk.tar.gz -C "$JRE_DIR"
            # Flatten
            NESTED=$(find "$JRE_DIR" -maxdepth 1 -type d -name "jdk-*" | head -1)
            if [ -n "$NESTED" ]; then
              mv "$NESTED"/* "$JRE_DIR"/
              rmdir "$NESTED"
            fi
          else
            URL="${BASE}/openjdk-${JAVA_VERSION}_windows-x64_bin.zip"
            curl -L --connect-timeout 10 --max-time 600 -o /tmp/jdk.zip "$URL"
            unzip -q /tmp/jdk.zip -d "$JRE_DIR"
            INNER=$(ls -d "$JRE_DIR"/*/ 2>/dev/null | head -1)
            if [ -n "$INNER" ]; then
              mv "$INNER"/* "$JRE_DIR"/
              rmdir "$INNER"
            fi
          fi
          echo "JRE downloaded to $JRE_DIR"

      - name: Convert icon to ICO for Windows
        if: matrix.platform == 'win'
        shell: bash
        run: |
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('frontend/public/favicon.ico')
          sizes = [(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          img.save('installer/electron/icon.ico', format='ICO', sizes=sizes)
          "

      - name: Install Electron dependencies
        run: |
          cd installer/electron
          npm install

      - name: Build Electron app
        run: |
          cd installer/electron
          npm run build:${{ matrix.platform }}

      - name: Sign macOS app
        if: matrix.platform == 'mac'
        run: |
          cd installer/electron
          find dist -name "*.app" -exec codesign --force --deep --sign - {} \;

      - name: Upload desktop installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            installer/electron/dist/*.dmg
            installer/electron/dist/*.exe
          generate_release_notes: false
