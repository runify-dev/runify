name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build backend with Maven
        run: mvn clean package -DskipTests

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/target/backend-*-jar-with-dependencies.jar
          generate_release_notes: true

  build-desktop:
    needs: build-jar
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build backend with Maven
        run: mvn clean package -DskipTests

      - name: Copy jar to electron directory
        run: cp backend/target/backend-1.0.0-jar-with-dependencies.jar installer/electron/backend.jar

      - name: Install Electron dependencies
        run: |
          cd installer/electron
          npm install

      - name: Build Electron app
        run: |
          cd installer/electron
          npm run build:${{ matrix.platform }}

      - name: Upload desktop installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/electron/dist/*.dmg
            installer/electron/dist/*.exe
          generate_release_notes: false
