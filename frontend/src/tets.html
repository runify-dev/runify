<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带边框包裹和切换动画的菜单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#1e293b',
                    },
                    transitionProperty: {
                        'size': 'width, height, transform',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .animate-size {
                transition-property: width, height, transform;
                transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
                transition-duration: 300ms;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- 导航栏 -->
    <header class="sticky top-0 bg-white shadow-sm z-50 py-4">
        <div class="container mx-auto px-4">
            <!-- 带边框包裹的导航菜单 -->
            <nav class="relative flex justify-center">
                <div class="relative inline-flex p-1 bg-gray-100 rounded-xl">
                    <div class="flex relative">
                        <a href="#"
                            class="relative z-10 px-6 py-2 font-medium text-primary transition-colors duration-300 border-2 border-primary bg-white rounded-lg mx-1">
                            首页
                        </a>
                        <a href="#"
                            class="relative z-10 px-6 py-2 font-medium text-gray-600 transition-colors duration-300 border-2 border-transparent hover:border-gray-300 rounded-lg mx-1">
                            产品
                        </a>
                        <a href="#"
                            class="relative z-10 px-6 py-2 font-medium text-gray-600 transition-colors duration-300 border-2 border-transparent hover:border-gray-300 rounded-lg mx-1">
                            关于
                        </a>
                        <a href="#"
                            class="relative z-10 px-6 py-2 font-medium text-gray-600 transition-colors duration-300 border-2 border-transparent hover:border-gray-300 rounded-lg mx-1">
                            联系
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 页面内容 -->
    <main class="container mx-auto px-4 py-12 max-w-3xl">
        <h1 class="text-3xl font-bold text-dark mb-6">带边框包裹和切换动画的菜单</h1>
        <div class="space-y-4 text-gray-700">
            <p>此导航菜单具有以下特点：</p>
            <ul class="list-disc pl-5 space-y-2">
                <li>菜单项完全居中显示</li>
                <li>每个菜单项都有边框包裹</li>
                <li>切换时有平滑的颜色变化动画</li>
                <li>菜单宽度自适应内容</li>
                <li>白色背景与蓝色边框形成鲜明对比</li>
            </ul>
        </div>
    </main>
</body>

</html>
